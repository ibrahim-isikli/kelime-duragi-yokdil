<style>
/* Layout: tek sütun telefon uygulaması (max 560px) — yapışkan başlık, kayan içerik, sabit alt sekme çubuğu.
   Stil: ui-ux-pro-max → Claymorphism (kalın kenar, çift gölge, 16–24px köşe, 200ms yumuşak basış).
   Renk: "Study purple + correct green". Tipografi: Crimson Pro (başlık/kelime) + Atkinson Hyperlegible (gövde).
   Şıklar ÖSYM optik form balonları A–E olarak çizilir. */
:root{
  --bg:#FAF5FF;
  --surface:#FFFFFF;
  --sunk:#F3ECFD;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E2D6FA;
  --edge:#CDB8F5;
  --accent:#7C3AED;
  --on-accent:#FFFFFF;
  --accent-soft:#EDE4FD;
  --accent-ink:#5B21B6;
  --hero:#4C1D95;
  --on-hero:#F5F0FF;
  --good:#047857;
  --on-good:#FFFFFF;
  --good-soft:#D1FAE5;
  --bad:#B91C1C;
  --on-bad:#FFFFFF;
  --bad-soft:#FEE2E2;
  --sh-clay:6px 8px 18px rgba(91,33,182,.14), inset -3px -4px 8px rgba(91,33,182,.07), inset 3px 3px 6px rgba(255,255,255,.9);
  --sh-press:2px 3px 8px rgba(91,33,182,.12), inset -2px -2px 6px rgba(91,33,182,.09), inset 2px 2px 4px rgba(255,255,255,.8);
  --f-display:"Crimson Pro",Georgia,"Times New Roman",serif;
  --f-word:"Lexend","Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-s:14px;--r:18px;--r-l:24px;
  --t-press:200ms;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130D24;--surface:#1E1636;--sunk:#271D46;--ink:#F1ECFB;--muted:#BBB0D6;--line:#3A2E5C;--edge:#55438A;
  --accent:#A78BFA;--on-accent:#1A0B3D;--accent-soft:#2E2257;--accent-ink:#C4B5FD;--hero:#2A1B55;--on-hero:#F1ECFB;
  --good:#34D399;--on-good:#052E1F;--good-soft:#0F3A2C;--bad:#F87171;--on-bad:#3B0A0A;--bad-soft:#3D1A1F;
  --sh-clay:6px 8px 18px rgba(0,0,0,.45), inset -3px -4px 8px rgba(0,0,0,.25), inset 3px 3px 6px rgba(255,255,255,.05);
  --sh-press:2px 3px 8px rgba(0,0,0,.4), inset -2px -2px 6px rgba(0,0,0,.3), inset 2px 2px 4px rgba(255,255,255,.04);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130D24;--surface:#1E1636;--sunk:#271D46;--ink:#F1ECFB;--muted:#BBB0D6;--line:#3A2E5C;--edge:#55438A;
  --accent:#A78BFA;--on-accent:#1A0B3D;--accent-soft:#2E2257;--accent-ink:#C4B5FD;--hero:#2A1B55;--on-hero:#F1ECFB;
  --good:#34D399;--on-good:#052E1F;--good-soft:#0F3A2C;--bad:#F87171;--on-bad:#3B0A0A;--bad-soft:#3D1A1F;
  --sh-clay:6px 8px 18px rgba(0,0,0,.45), inset -3px -4px 8px rgba(0,0,0,.25), inset 3px 3px 6px rgba(255,255,255,.05);
  --sh-press:2px 3px 8px rgba(0,0,0,.4), inset -2px -2px 6px rgba(0,0,0,.3), inset 2px 2px 4px rgba(255,255,255,.04);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero)}
button,a{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.1}
.mono{font-variant-numeric:tabular-nums}

/* Clay surfaces: one recipe, applied by role */
.clay{background:var(--surface);border:3px solid var(--edge);border-radius:var(--r);box-shadow:var(--sh-clay)}
.press{transition:box-shadow var(--t-press) ease-out,transform var(--t-press) ease-out,background-color var(--t-press) ease-out}
.press:active:not(:disabled){box-shadow:var(--sh-press);transform:translateY(2px)}
@media (prefers-reduced-motion: reduce){.press,.press:active{transition:none;transform:none}}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hero);color:var(--on-hero);border-radius:0 0 var(--r-l) var(--r-l)}
.top-in{max-width:560px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:12px 14px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.brand-logo{--logo-dot:#FBBF24;width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--on-hero) 14%,transparent);color:var(--on-hero)}
.brand-logo svg{width:30px;height:30px}
.brand-mark{display:grid;grid-template-columns:repeat(3,8px);gap:3px;padding:7px;border-radius:12px;background:color-mix(in srgb,var(--on-hero) 12%,transparent)}
.brand-mark i{width:8px;height:8px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--on-hero) 60%,transparent)}
.brand-mark i.f{background:var(--on-hero);border-color:var(--on-hero)}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1;white-space:nowrap}
.brand small{display:block;font-size:12px;opacity:.8;letter-spacing:.6px;text-transform:uppercase;font-weight:700}
.brand>div{min-width:0}
.brand b{display:block;overflow:hidden;text-overflow:ellipsis;font-size:clamp(17px,5vw,21px)}
.brand{gap:10px}
.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;letter-spacing:.5px}
.top-in{gap:8px}
.streak{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;background:color-mix(in srgb,var(--on-hero) 14%,transparent);white-space:nowrap}
.streak svg{width:16px;height:16px}
button.streak{border:0;color:inherit;min-height:40px;cursor:pointer}
#strsheet{max-height:min(88vh,720px)}
#strsheet .sheet-ttl h2{font-size:26px}
#strsheet .sheet-head{padding-bottom:10px}
#strsheet .str-top{padding-top:10px}
#strsheet .str-big b{font-size:46px}
#strsheet .str-big svg{width:26px;height:26px}
#strsheet .str-big span:last-child{font-size:15px}
#strsheet .str-best b{font-size:17px}
#strsheet .str-msg{font-size:14px;margin-top:4px}
#strsheet .str-stats{margin-top:12px;padding:8px 0}
#strsheet .str-stats .dd{font-size:22px}
#strsheet .motto{margin-top:12px;padding:10px 14px}
#strsheet .motto blockquote{font-size:16px}
#strsheet .motto figcaption{margin-top:4px;text-transform:none;letter-spacing:0;font-size:13px;font-weight:700}
#strsheet .motto figcaption::before{content:"— "}
#strsheet .sb-sec{padding:14px 0 2px}
#strsheet .cal-h,#strsheet .cal{grid-template-columns:repeat(7,30px);gap:4px 8px}
#strsheet .c{width:30px;height:30px}
#strsheet .c b{font-size:12px}
#strsheet .cal-legend .c{width:12px;height:12px}
#strsheet .cal-legend{font-size:12px;margin-top:8px}
.str-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:14px}
.str-big{display:flex;align-items:baseline;gap:8px;color:var(--accent-ink)}
.str-big svg{width:34px;height:34px;align-self:center}
.str-big b{font-family:var(--f-display);font-size:64px;line-height:1}
.str-big span:last-child{font-size:18px;font-weight:700;color:var(--muted)}
.str-best{text-align:right;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.str-best b{display:block;font-size:20px;letter-spacing:0;text-transform:none;color:var(--ink);font-family:var(--f-display)}
.str-msg{margin:8px 0 0;font-size:15px;color:var(--muted)}
.motto{margin:14px 0 0;padding:14px 16px;border-radius:16px;background:var(--accent-soft)}
.motto blockquote{margin:0;font-family:var(--f-display);font-size:20px;line-height:1.3;font-weight:700;color:var(--accent-ink);text-wrap:balance}
.motto blockquote::before{content:"“";margin-right:2px}
.motto blockquote::after{content:"”";margin-left:2px}
.motto figcaption{margin-top:6px;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.cal-h,.cal{display:grid;grid-template-columns:repeat(7,36px);gap:6px 8px;justify-content:center}
#strbody .sb-sec:has(.cal) .sb-h{justify-content:center}
.cal-h span{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:2px}
.c{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;font-style:normal}
.c b{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.c0{background:transparent}
.c1{background:var(--accent-soft)}
.c1 b{color:var(--accent-ink)}
.c2{background:var(--accent)}
.c2 b{color:var(--on-accent)}
.cf b{opacity:.35}
.c.now{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:13px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend .c{width:12px;height:12px;border-radius:50%}
.cal-legend .c0{box-shadow:inset 0 0 0 1.5px var(--edge)}
.str-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.str-stats div{display:flex;flex-direction:column;align-items:center;gap:2px}
.str-stats div+div{border-left:1px solid var(--line)}
.str-stats .dt{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.str-stats .dd{display:block;margin:0;font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.str-stats span{font-size:12px;color:var(--muted)}
.str-week{margin:0;font-size:16px;color:var(--muted)}
.str-week b{font-family:var(--f-display);font-size:32px;color:var(--ink)}
.gear{width:40px;height:40px;flex:none;border-radius:50%;border:0;display:grid;place-items:center;background:color-mix(in srgb,var(--on-hero) 14%,transparent);color:var(--on-hero);transition:background-color var(--t-press) ease-out,transform var(--t-press) ease-out}
.gear svg{width:20px;height:20px}
.gear:active{transform:rotate(30deg)}
.set-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:12px 16px;min-height:60px;border:0;border-radius:16px;background:var(--sunk);transition:background-color var(--t-press) ease-out}
.set-row:active{background:var(--line)}
.set-row b{display:block;font-size:16px;color:var(--bad)}
.set-row small{display:block;font-size:13px;color:var(--muted)}
.set-row i{font-style:normal;font-size:22px;color:var(--muted)}
.set-confirm{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 10px 10px 16px;min-height:60px;border-radius:16px;background:var(--bad-soft)}
.set-confirm p{margin:0;font-weight:700;font-size:15px;color:var(--ink)}
.set-confirm div{display:flex;gap:6px}
.pill{min-height:40px;padding:0 14px;border:0;border-radius:99px;font-weight:700;font-size:14px;background:var(--surface);color:var(--ink)}
.pill.danger{background:var(--bad);color:var(--on-bad)}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 4px}
#setsheet{max-height:min(90vh,760px)}
.fs-opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px!important}
.fs-opt small{font-size:12px;font-weight:700}
:root[data-fs="s"] #view{zoom:.9}
:root[data-fs="l"] #view{zoom:1.15}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border:0;border-radius:14px;background:transparent;min-height:72px}
.sw i{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35);transition:transform var(--t-press) ease-out}
.sw span{font-size:13px;font-weight:700;color:var(--muted)}
.sw[aria-pressed="true"] i{transform:scale(1.08);outline:3px solid var(--ink);outline-offset:3px}
.sw[aria-pressed="true"] span{color:var(--ink)}
/* accent palettes */

@media (prefers-color-scheme: dark){

:root[data-accent="teal"]:not([data-theme="light"]){--bg:#0A1716;--surface:#12221F;--sunk:#183029;--line:#24423B;--edge:#33605A;--accent:#2DD4BF;--on-accent:#042F2C;--accent-soft:#123B36;--accent-ink:#5EEAD4;--hero:#0F3D39}
:root[data-accent="amber"]:not([data-theme="light"]){--bg:#1A110A;--surface:#251911;--sunk:#302116;--line:#45301F;--edge:#66472D;--accent:#FB923C;--on-accent:#3A1404;--accent-soft:#3E2515;--accent-ink:#FDBA74;--hero:#4A1D0B}

:root[data-accent="amber"][data-theme="dark"]{--bg:#1A110A;--surface:#251911;--sunk:#302116;--line:#45301F;--edge:#66472D;--accent:#FB923C;--on-accent:#3A1404;--accent-soft:#3E2515;--accent-ink:#FDBA74;--hero:#4A1D0B}
:root[data-accent="rose"][data-theme="dark"]{--bg:#1A0B12;--surface:#26111B;--sunk:#321724;--line:#4A2335;--edge:#6E3450;--accent:#F472B6;--on-accent:#3D0A22;--accent-soft:#3F1528;--accent-ink:#F9A8D4;--hero:#4C0F2B}

/* Main */
main{max-width:560px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:20px calc(104px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:3px solid var(--edge);border-radius:var(--r);box-shadow:var(--sh-clay);padding:16px}
.row{display:flex;gap:10px;align-items:center}
.muted{color:var(--muted)}
.h-sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.h-sec h2{font-size:26px}

/* Buttons & chips */
.btn{border:3px solid transparent;border-radius:var(--r-s);padding:12px 18px;font-weight:700;font-size:16px;background:var(--ink);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;box-shadow:var(--sh-clay);transition:box-shadow var(--t-press) ease-out,transform var(--t-press) ease-out}
.btn:active:not(:disabled){box-shadow:var(--sh-press);transform:translateY(2px)}
.btn.alt{background:var(--surface);color:var(--ink);border-color:var(--edge)}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.good{background:var(--good);color:var(--on-good)}
.btn.bad{background:var(--bad);color:var(--on-bad)}
.btn svg{width:20px;height:20px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--edge);background:var(--surface);border-radius:99px;padding:8px 14px;min-height:44px;font-size:14px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:6px;transition:background-color var(--t-press) ease-out,box-shadow var(--t-press) ease-out}
.chip:active:not(:disabled){box-shadow:var(--sh-press)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chip .n{font-family:var(--f-mono);font-size:12px;opacity:.75}
span.chip{cursor:default;min-height:36px;font-weight:400}
.link svg{width:18px;height:18px;flex:none}
.link{background:var(--accent-soft);border:0;border-radius:99px;padding:0 14px;min-height:44px;color:var(--accent-ink);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}

/* Home */
.today{background:var(--hero);color:var(--on-hero);border-radius:var(--r-l);padding:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;box-shadow:var(--sh-clay)}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .lbl b{font-family:var(--f-display);font-size:30px}
.ring .lbl span{font-size:12px;opacity:.8}
.today h1{font-size:26px;margin-bottom:4px}
.today p{margin:0;font-size:14px;opacity:.85}
.goal{margin-top:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
.goal button{border:2px solid color-mix(in srgb,var(--on-hero) 35%,transparent);background:transparent;color:var(--on-hero);border-radius:99px;min-width:44px;min-height:44px;padding:0 10px;font-weight:700;font-size:14px}
.goal button[aria-pressed="true"]{background:var(--on-hero);border-color:var(--on-hero);color:var(--hero)}
.today2{background:var(--surface);border:3px solid var(--edge);border-radius:var(--r-l);padding:18px 20px;box-shadow:var(--sh-clay);display:flex;flex-direction:column;gap:8px}
.t-row{display:flex;justify-content:space-between;align-items:center}
.t-goal{font-size:14px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:0 14px;min-height:40px;border:0;border-radius:99px;display:inline-flex;align-items:center;gap:6px}
.t-pick{display:grid;grid-template-rows:0fr;margin-top:-8px;transition:grid-template-rows .34s cubic-bezier(.2,.7,.2,1),margin-top .34s cubic-bezier(.2,.7,.2,1)}
.t-pick.open{grid-template-rows:1fr;margin-top:0}
.t-pick-in{min-height:0;overflow:hidden;opacity:0;transform:translateY(-6px);transition:opacity .24s ease-out,transform .34s cubic-bezier(.2,.7,.2,1)}
.t-pick.open .t-pick-in{opacity:1;transform:none;transition-delay:.06s}
.t-chev{display:inline-block;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.t-goal[aria-expanded="true"] .t-chev{transform:rotate(180deg)}
@media (prefers-reduced-motion: reduce){.t-pick,.t-pick-in,.t-chev{transition:none}}
.t-num{display:flex;align-items:baseline;gap:8px}
.t-num b{font-family:var(--f-display);font-size:56px;line-height:1;color:var(--accent-ink)}
.t-num span{font-size:17px;font-weight:700;color:var(--muted)}
.t-bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.t-bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s ease-out}
.t-msg{margin:0;font-size:15px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:3px solid var(--edge);border-radius:var(--r-s);padding:12px;box-shadow:var(--sh-clay)}
.stat b{display:block;font-family:var(--f-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.wotd .word{font-family:var(--f-word);font-size:40px;font-weight:600;line-height:1.05;margin:6px 0 4px;color:var(--accent-ink)}
.wotd .mean{font-size:18px;font-weight:700}
.tag{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-weight:500;white-space:nowrap}
.quick3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 0}
.qc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 4px;border:0;background:transparent;border-radius:16px}
.qc-i{position:relative;width:min(104px,26vw);height:min(104px,26vw);border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);transition:transform var(--t-press) ease-out,background-color var(--t-press) ease-out}
.qc-i svg{width:40px;height:40px}
.qc.main .qc-i{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 20px -8px var(--accent)}
.qc-i{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s cubic-bezier(.2,.7,.2,1),background-color .2s ease-out}
.qc-i svg{transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.qc-l{transition:color .2s ease-out}
@media (hover:hover){
.qc:hover:not(:disabled) .qc-i{transform:translateY(-4px) scale(1.05);box-shadow:0 14px 26px -10px var(--accent)}
.qc:hover:not(:disabled) .qc-l{color:var(--accent-ink)}
.qc[data-act="study"]:hover .qc-i svg{transform:rotate(-8deg) scale(1.08)}
.qc.main:hover .qc-i svg{transform:translateX(3px) scale(1.1)}
.qc[data-act="wrongquiz"]:hover:not(:disabled) .qc-i svg{transform:rotate(-200deg)}
.qc:not(.main):hover:not(:disabled) .qc-i{background:color-mix(in srgb,var(--accent) 22%,var(--accent-soft))}}
.qc:focus-visible .qc-i{transform:translateY(-4px) scale(1.05)}
.qc:active:not(:disabled) .qc-i{transform:scale(.94);transition-duration:.12s}
@media (prefers-reduced-motion: reduce){.qc-i,.qc-i svg{transition:none!important;transform:none!important}}
.qc-l{font-size:16px;font-weight:700;color:var(--ink)}
.qc:disabled{opacity:.45;cursor:not-allowed}

/* Quiz */
.qhead{display:flex;align-items:center;gap:12px}
.qprog{flex:1;height:12px;background:var(--sunk);border-radius:99px;overflow:hidden;box-shadow:inset 1px 1px 3px rgba(0,0,0,.08)}
.qprog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease-out}
.stem{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:150px;background:var(--surface);border:3px solid var(--edge);border-radius:var(--r-l);padding:40px 20px;box-shadow:var(--sh-clay)}
.stem .row{position:absolute;top:14px;left:16px;right:16px}
.stem .q{font-size:14px;color:var(--muted);font-weight:700}
.stem .w{font-family:var(--f-word);font-weight:600;font-size:clamp(32px,9vw,44px);line-height:1.1;margin:0;overflow-wrap:anywhere;color:var(--accent-ink)}
.stem .w.tr{font-family:var(--f-body);font-style:normal;font-weight:700;font-size:clamp(22px,6vw,28px);color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:3px solid var(--edge);border-radius:var(--r-s);padding:10px 14px 10px 10px;min-height:58px;font-weight:700;font-size:16px;box-shadow:var(--sh-clay);transition:box-shadow var(--t-press) ease-out,transform var(--t-press) ease-out,background-color var(--t-press) ease-out}
.opt:active:not(:disabled){box-shadow:var(--sh-press);transform:translateY(2px)}
.opt:disabled{cursor:default}
.bub{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:14px;font-weight:500;flex:none}
.bub svg{width:18px;height:18px}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .bub{background:var(--good);border-color:var(--good);color:var(--on-good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .bub{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.opt.dim{opacity:.55;box-shadow:none}
.fb{border-radius:var(--r-s);padding:12px 14px;font-size:16px;font-weight:700;border:3px solid transparent}
.fb.ok{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.fb span{display:block;font-weight:400;color:var(--ink);margin-top:2px}
.fb .fb-mine{margin-top:8px;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--bad) 30%,transparent);color:var(--muted)}
.opt-mine{display:block;margin-top:2px;font-size:14px;font-weight:400;color:var(--bad)}
.opt-mine i{font-family:var(--f-word);font-size:16px}
.wl-mine{display:block;margin-top:2px;font-size:13px;color:var(--bad)}
.wl-mine i{font-family:var(--f-word)}
.fb i{font-family:var(--f-word);font-size:18px}
.setup-grp{display:flex;flex-direction:column;gap:10px}
.qmodes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.qm{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;min-height:60px;padding:14px 12px;border-radius:var(--r);border:3px solid var(--edge);background:var(--surface);box-shadow:var(--sh-clay);transition:background-color var(--t-press) ease-out,border-color var(--t-press) ease-out,box-shadow var(--t-press) ease-out,transform var(--t-press) ease-out}
.qm:active{box-shadow:var(--sh-press);transform:translateY(2px)}
.qm-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);margin-bottom:6px}
.qm-ic svg{width:22px;height:22px}
.qm b{font-size:16px;line-height:1.2}
.qm span:last-child{font-size:13px;line-height:1.3;color:var(--muted)}
.qm[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.qm[aria-pressed="true"] b,.qm[aria-pressed="true"] span:last-child{color:var(--on-accent)}
.qm[aria-pressed="true"] .qm-ic{background:color-mix(in srgb,var(--on-accent) 22%,transparent);color:var(--on-accent)}
.qseg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:16px;background:var(--sunk)}
.qseg button{min-height:48px;border:0;border-radius:12px;background:transparent;font-weight:700;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums;transition:background-color var(--t-press) ease-out,color var(--t-press) ease-out}
.qseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(40,20,90,.12)}
.mode{display:grid;grid-template-columns:1fr;gap:10px}
.mode button{display:flex;gap:12px;align-items:center;text-align:left;border:3px solid var(--edge);background:var(--surface);border-radius:var(--r-s);padding:12px;min-height:64px;box-shadow:var(--sh-clay);transition:box-shadow var(--t-press) ease-out,border-color var(--t-press) ease-out}
.mode button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode button[aria-pressed="true"] .bub{background:var(--accent);color:var(--on-accent)}
.mode b{display:block;font-size:16px}
.mode span{font-size:14px;color:var(--muted)}
.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.score .big{font-family:var(--f-display);font-size:68px;font-weight:700;line-height:1;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.score h2{font-size:26px}
.wl{display:flex;flex-direction:column;padding-block:4px}
.wl div{padding:10px 0;border-bottom:2px dashed var(--line);display:flex;justify-content:space-between;gap:12px}
.wl div:last-child{border-bottom:0}
.wl b{font-family:var(--f-word);font-weight:600;font-size:20px}
.wl span{text-align:right;color:var(--muted);font-size:15px}

/* Grammar */
.topics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.topic{background:var(--surface);border:3px solid var(--edge);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px;box-shadow:var(--sh-clay);transition:box-shadow var(--t-press) ease-out,transform var(--t-press) ease-out}
.topic:active{box-shadow:var(--sh-press);transform:translateY(2px)}
.topic b{font-family:var(--f-display);font-size:20px;line-height:1.1}
.topic span{font-size:13px;color:var(--muted)}
.gback{align-self:flex-start}
.tbl-wrap{overflow-x:auto;border:3px solid var(--edge);border-radius:var(--r-s);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--sunk)}
td code,.f{font-family:var(--f-mono);font-size:13px;color:var(--accent-ink);white-space:nowrap}
.tense{display:flex;flex-direction:column;gap:10px}
.tc{background:var(--surface);border:3px solid var(--edge);border-radius:var(--r-s);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.tc h3{grid-column:1/-1;font-size:20px;margin-bottom:2px}
.tc .f{white-space:normal}
.tc .tr{text-align:right;font-size:15px;font-weight:700}
.tc .neg{opacity:1;color:var(--muted)}
.ex{display:flex;flex-direction:column;gap:10px}
.ex div{background:var(--surface);border:3px solid var(--edge);border-radius:var(--r-s);padding:12px 14px}
.ex b{display:block;font-size:14px;margin-bottom:2px}
.ex i{font-family:var(--f-word);font-size:18px}
.rel-grp{display:flex;flex-direction:column;gap:8px}
.rel-grp h3{font-size:20px;display:flex;gap:8px;align-items:baseline}
.note{font-size:14px;color:var(--muted);margin:0}

/* Dictionary */
.search{position:relative}
.search label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.search input{width:100%;font:inherit;font-size:16px;min-height:52px;padding:12px 14px 12px 46px;border-radius:var(--r-s);border:3px solid var(--edge);background:var(--surface);color:var(--ink);box-shadow:inset 2px 2px 5px rgba(0,0,0,.06)}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.dl{display:flex;flex-direction:column;background:var(--surface);border:3px solid var(--edge);border-radius:var(--r);padding:0 14px}
.de{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:2px dashed var(--line)}
.de:last-child{border-bottom:0}
.de b{font-family:var(--f-word);font-weight:600;font-size:21px;overflow-wrap:anywhere}
.de .m{grid-column:1/-1;font-size:15px;color:var(--muted)}
.de .st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.de .st svg{width:16px;height:16px}
.de .st.l{color:var(--good)}
.de .st.w{color:var(--bad)}
.empty{padding:20px;text-align:center;color:var(--muted)}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:3px solid var(--edge);border-radius:var(--r-l) var(--r-l) 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:var(--gut-l);padding-right:var(--gut-r)}
.tabs-in{position:relative;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:6px;--ti:0}
.tab-ind{position:absolute;top:6px;bottom:6px;left:0;width:calc((100% - 16px)/5);border-radius:var(--r-s);background:var(--accent-soft);transform:translateX(calc(var(--ti) * (100% + 4px)));transition:transform .38s cubic-bezier(.2,.7,.2,1),background-color .2s;pointer-events:none}
.tab{position:relative;z-index:1}
#view.vt-r{animation:vtR .32s cubic-bezier(.2,.7,.2,1)}
#view.vt-l{animation:vtL .32s cubic-bezier(.2,.7,.2,1)}
@keyframes vtR{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes vtL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.tab-ind{transition:none}#view.vt-r,#view.vt-l{animation:none}}
.tab{border-radius:var(--r-s);padding:6px 0 7px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;transition:background-color var(--t-press) ease-out,color var(--t-press) ease-out}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent-ink)}
.tab svg{transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.tab[aria-current="page"] svg{transform:translateY(-1px) scale(1.08)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.foot{font-size:13px;color:var(--muted);text-align:center;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* word font: Lexend, upright */
.opt-mine i,.wl-mine i,.fb i,.sb-en b,.det-en b,.ex i{font-style:normal}
.sb-en b{font-weight:600}
.face .word{font-size:clamp(34px,10vw,48px);letter-spacing:-.01em}
.face .mean{font-family:var(--f-word);font-weight:600;font-size:clamp(34px,10vw,48px);line-height:1.15;letter-spacing:-.01em}
.face.back .face-mid .hint{font-family:var(--f-word);font-size:19px;font-weight:500;margin-bottom:4px}
.stem .w{font-size:clamp(28px,8vw,38px);letter-spacing:-.01em}
.wotd .word{font-size:34px;letter-spacing:-.01em}
.sb-en,.exen,.ex i{font-size:18px;line-height:1.45}
.qask{padding:4px 2px 4px;text-align:center}
.qask h2{font-family:var(--f-display);font-size:24px;margin:4px 0 6px}
.qask p{margin:0 0 18px;color:var(--muted);font-size:15px;line-height:1.45}
.qask-btns{display:grid;gap:10px}
.dmore{width:100%;margin-top:12px}
.de{display:block;content-visibility:auto;contain-intrinsic-size:auto 76px}
.de.open{content-visibility:visible}
.de-h{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;padding:0;border:0;background:transparent;text-align:left;color:inherit}
.de .m{grid-column:1/-1}
.de.has .de-h{cursor:pointer}
.de-chev{display:inline-block;color:var(--muted);font-size:14px;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.de.open .de-chev{transform:rotate(180deg);color:var(--accent-ink)}
.de-x{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s cubic-bezier(.2,.7,.2,1)}
.de.open .de-x{grid-template-rows:1fr}
.de-xi{min-height:0;overflow:hidden;opacity:0;transition:opacity .24s ease-out}
.de.open .de-xi{opacity:1;transition-delay:.06s}
.de-xi section{padding-top:14px}
.de-xi .sb-cmp li{padding:7px 10px}
@media (hover:hover){.de.has .de-h:hover b{color:var(--accent-ink)}}
@media (prefers-reduced-motion: reduce){.de-x,.de-xi,.de-chev{transition:none}}
.cat .c{white-space:nowrap;font-size:12px}
.qc{min-width:0}
.qc-i{width:min(104px,100%)!important;height:auto!important;aspect-ratio:1}
.qc-l{text-align:center;line-height:1.2;white-space:nowrap;font-size:clamp(12px,3.9vw,16px)!important}
.tab span{white-space:nowrap;font-size:clamp(10px,3.1vw,12px)}
.qpause{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r);background:var(--accent-soft);border:2px solid var(--edge)}
.qpause b{display:block;font-size:16px;color:var(--accent-ink)}
.qpause span{font-size:14px;color:var(--muted)}
.qpause-btns{display:flex;gap:8px;align-items:center}
.qpause-btns .btn{flex:1;min-height:46px}
.qpause-btns .pill{min-height:46px;padding:0 16px;background:var(--surface);border:1px solid var(--line)}
.lchip{cursor:pointer;font-weight:500}
.lchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lchip[aria-pressed="true"] .n{color:var(--on-accent);opacity:1}
.ltoast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;width:min(528px,calc(100% - 32px));transform:translate(-50%,10px);opacity:0;padding:12px 16px;border-radius:16px;background:var(--hero);color:var(--on-hero);box-shadow:0 12px 30px -10px rgba(0,0,0,.4);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;transition:opacity .2s ease-out,transform .25s cubic-bezier(.2,.7,.2,1)}
.ltoast.show{opacity:1;transform:translate(-50%,0)}
.ltoast b{font-family:var(--f-word);font-weight:600;font-size:18px}
.ltoast i{font-style:normal;opacity:.7}
.ltoast span{font-size:15px}
.ltoast em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.7}
@keyframes lmIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.tbl-wrap{background:linear-gradient(to right,var(--surface) 30%,transparent) left/40px 100% no-repeat local,linear-gradient(to left,var(--surface) 30%,transparent) right/40px 100% no-repeat local,radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.14),transparent) left/12px 100% no-repeat scroll,radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.14),transparent) right/12px 100% no-repeat scroll;background-color:var(--surface)}
@media (prefers-reduced-motion: reduce){.ltoast{transition:none}}
.face .word,.face .mean{overflow-wrap:normal!important;word-break:normal;hyphens:manual}
.face-bot{display:flex;justify-content:center;min-height:28px}
.face-top{min-height:52px}
.storewarn{position:relative;z-index:5;max-width:560px;margin:10px auto 0;padding:10px 8px 10px 14px;width:calc(100% - var(--gut-l) - var(--gut-r));display:flex;gap:8px;align-items:flex-start;border-radius:var(--r);background:var(--surface);border:2px solid var(--bad);color:var(--ink)}
[hidden]{display:none!important}
.storewarn p{margin:0;font-size:14px;line-height:1.45;flex:1}
.storewarn b{color:var(--bad)}
/* cards: flip button (keyboard / screen reader) shows its focus on the card */
.card-wrap:has(> .flipsr:focus-visible) .fcard{outline:3px solid var(--accent);outline-offset:4px;border-radius:var(--r-l)}
.cardhint{display:flex;align-items:center;gap:10px;margin-top:-4px;padding:8px 8px 8px 14px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px;font-weight:700;animation:chIn .35s cubic-bezier(.2,.7,.2,1) both;transition:opacity .25s ease-out}
.cardhint.gone{opacity:0}
.deck>.card-wrap+.cardhint{margin-top:20px}
.deck:has(> .cardhint) .fcard{height:clamp(170px,calc(100vh - 400px),440px);height:clamp(170px,calc(100dvh - 400px),440px)}
.ch-t{flex:1;min-width:0;line-height:1.35}
.ch-key{display:none}
@media (hover:hover) and (pointer:fine){.ch-touch{display:none}.ch-key{display:inline}}
.ch-x{flex:none;min-height:44px;padding:0 16px;border:0;border-radius:99px;background:var(--surface);color:var(--accent-ink);font-weight:700;font-size:14px}
@keyframes chIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card-wrap.nudge .fcard{animation:nudge 1.1s cubic-bezier(.4,0,.2,1) .5s 1}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(-22px) rotate(-1.5deg)}60%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){.cardhint{animation:none}.card-wrap.nudge .fcard{animation:none}}
/* QA-005: short landscape screens */
@media (orientation:landscape) and (max-height:520px){
  .top{position:relative;top:0}
  .top-in{padding-block:6px}
  .brand small{display:none}
  .brand-logo{width:34px;height:34px}
  main{padding-block:12px calc(64px + env(safe-area-inset-bottom,0px))}
  .tabs-in{padding-block:4px}
  .tab-ind{top:4px;bottom:4px}
  .tab{min-height:44px;flex-direction:row;gap:6px;padding:2px 0}
  .tab svg{width:20px;height:20px}
  .deck{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-template-areas:"tabs card" "prog card" "hint card" ". card";grid-template-rows:auto auto auto 1fr;gap:12px 18px;align-items:start}
  .deck>.dtabs-wrap{grid-area:tabs;margin:0;min-width:0}
  .deck>.dtabs-wrap .dtabs{padding:4px 2px 8px}
  .deck>.deck-prog{grid-area:prog}
  .deck>.card-wrap,.deck>.panel.empty{grid-area:card;min-width:0}
  .deck>.cardhint,.deck>.card-wrap+.cardhint{grid-area:hint;margin:0;border-radius:18px;padding:4px 4px 4px 12px;font-size:13px}
  .deck{row-gap:8px}
  .deck:has(> .cardhint) .fcard{height:clamp(180px,calc(100vh - 176px),380px);height:clamp(180px,calc(100dvh - 176px),380px)}
  .deck .fcard{height:clamp(180px,calc(100vh - 176px),380px);height:clamp(180px,calc(100dvh - 176px),380px)}
  .face{padding:14px}
  .drawer-body{max-height:60vh}
}
/* QA-014: very narrow screens and large text */
.topics{grid-template-columns:repeat(2,minmax(0,1fr))}
.topic{min-width:0}.topic b,.topic span{overflow-wrap:anywhere}
@media (max-width:300px){.topics{grid-template-columns:minmax(0,1fr)}}
:root[data-fs="l"] .topics{grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr))}
.lchip{white-space:normal;max-width:100%;text-align:left}
.de-h{grid-template-columns:minmax(0,1fr) auto}
.de-h b{overflow-wrap:anywhere;min-width:0}
.wl div>span{min-width:0;overflow-wrap:anywhere}
.wl b{flex:none;max-width:50%;overflow-wrap:anywhere}
.sb-cmp li{grid-template-columns:minmax(0,auto) 18px minmax(0,1fr)}
.sb-cmp b{min-width:min(96px,28vw);overflow-wrap:anywhere}
.sb-cmp span,.sb-cmp small{min-width:0;overflow-wrap:anywhere}
h3.sb-h{line-height:1.5;text-wrap:wrap}
/* QA-013: 44px touch targets */
button.streak{min-height:44px}
.gear{width:44px;height:44px}
.t-goal{min-height:44px}
.sheet-x{width:44px!important;height:44px!important}
.pill{min-height:44px}
.tbl-wrap:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.about{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.bk-st{margin:0 0 12px;font-size:14px;line-height:1.45;color:var(--muted)}
.bk-st.bad{color:var(--bad);font-weight:700}
.bk-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pill.bk{flex:1;min-height:48px;background:var(--sunk);position:relative;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.pill.bk.acc{background:var(--accent);color:var(--on-accent)}
.bk-file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.bk-file:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.bk-lbl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
.bk-ta{width:100%;box-sizing:border-box;font:13px/1.4 var(--f-mono,monospace);padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);resize:vertical;margin-bottom:10px}
.bk-err{margin:0 0 10px;color:var(--bad);font-weight:700;font-size:14px}
.set-row.plain b{color:var(--ink)}
.ltoast.msg span{font-size:15px;font-weight:700}
.crash h2{margin:0 0 6px}.crash p{margin:0 0 14px}
.crash-btns{display:grid;gap:10px;margin-bottom:12px}

let route='home';

const SCROLL={};const scrollKey=r=>r==='gramer'?'gramer:'+(GT||''):r;
/* hash = "#route" or "#gramer/<topic>" so the back button walks topics too */
function parseHash(){const h=decodeURIComponent(location.hash.slice(1)||'home');const i=h.indexOf('/');const r=i<0?h:h.slice(0,i),sub=i<0?null:h.slice(i+1);
  return TABS.some(t=>t[0]===r)?[r,sub]:['home',null]}
const validTopic=t=>!!t&&TOPICS.some(x=>x[0]===t);
let gFromList=false;
window.addEventListener('hashchange',()=>{const prev=route;SCROLL[scrollKey(prev)]=window.scrollY;closeAllSheets();
  const [r,sub]=parseHash();route=r;
  if(r==='gramer'){const nt=validTopic(sub)?sub:null;if(nt!==GT){GT=nt;S.gt=nt;saveSoon()}}else gFromList=false;
  const di=TABS.findIndex(t=>t[0]===route)-TABS.findIndex(t=>t[0]===prev);render();window.scrollTo(0,SCROLL[scrollKey(route)]||0);
  if(di&&!reducedMotion()){const v=$('#view');v.classList.remove('vt-l','vt-r');void v.offsetWidth;v.classList.add(di>0?'vt-r':'vt-l')}});

function renderTabs(){
  const tb=$('#tabs');if(!tb.querySelector('.tab'))tb.innerHTML='<span class="tab-ind" aria-hidden="true"></span>'+TABS.map(([k,l,i])=>`<a class="tab" href="#${k}" data-r="${k}">${ICON[i]}<span>${l}</span></a>`).join('');
  const ga=tb.querySelector('.tab[data-r="gramer"]');if(ga)ga.setAttribute('href','#gramer'+(GT?'/'+GT:''));
  tb.querySelectorAll('.tab').forEach(a=>{if(a.dataset.r===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  tb.style.setProperty('--ti',Math.max(0,TABS.findIndex(t=>t[0]===route)));

function fitCardText(){document.querySelectorAll('#cwrap .face .word,#cwrap .face .mean').forEach(el=>{el.style.fontSize='';let fs=parseFloat(getComputedStyle(el).fontSize),n=0;
  while(el.scrollWidth>el.clientWidth+1&&fs>20&&n<20){fs-=2;el.style.fontSize=fs+'px';n++}})}
window.addEventListener('resize',()=>{if(route==='kartlar')fitCardText()});
function render(){try{renderInner()}catch(err){showCrash(err)}}
/* error boundary: never leave a blank screen; offer recovery without silently losing data */
function showCrash(err){try{console.warn('render failed',err)}catch(_){}
  const v=document.getElementById('view');if(!v)return;
  v.innerHTML=`<div class="stack"><section class="panel crash" role="alert"><h2>Bir sorun oluştu</h2><p>Bu ekran açılamadı. Verilerin silinmedi.</p><div class="crash-btns"><button class="btn acc" data-act="crashretry">Yeniden dene</button><button class="btn alt" data-act="bkdown">Yedeği indir</button><button class="pill" data-act="crashreset">Verileri sıfırla</button></div><p class="sb-empty">Sıfırlamadan önce mevcut verilerin bu cihazda ayrı bir yedeğe kaydedilir.</p></section></div>`}
function storeBanner(){const el=document.getElementById('storewarn');if(!el)return;const show=!STORE.ok&&!STORE.warned;el.hidden=!show;
  if(show)el.innerHTML=`<p><b>İlerleme kaydedilemiyor.</b> Bu cihaz veri saklamaya izin vermiyor (depolama dolu ya da gizli mod açık olabilir). Çalışmaya devam edebilirsin ama uygulamayı kapatınca ilerlemen silinir.</p><button class="sheet-x" data-act="storeok" aria-label="Uyarıyı kapat">${ICON.cross}</button>`}
function renderInner(){saveQuiz();
  renderTabs();
  const v=$('#view');
  const h1=`<h1 class="sr">Kelime Durağı: ${route==='gramer'&&GT&&validTopic(GT)?TOPICS.find(x=>x[0]===GT)[1]+' (Gramer)':TABS.find(t=>t[0]===route)[1]}</h1>`;
  if(route==='kartlar'){v.innerHTML=h1+viewCards();bindSwipe();bindTabs();fitCardText();if(!obSeen('flip')&&!CS.nudged&&CS.cur&&!reducedMotion()){CS.nudged=true;const w=document.getElementById('cwrap');w&&w.classList.add('nudge')}}

  if(t==='reduce')return `<span class="eyebrow">Relative clause kısaltmaları</span><div class="ex">
    <div><b>noun + Ving · who / which / that + active fiil</b><i>Carbon dioxide is a compound which consists of one carbon atom…</i><br><i>→ a compound consisting of one carbon atom…</i></div>
    <div><b>noun + V3 · who / which / that + passive fiil</b><i>The weapon which was found near the body was a pistol which was made in Europe.</i><br><i>→ The weapon found near the body was a pistol made in Europe.</i></div>
    <div><b>noun + to V1 · the first / the only / the last / superlative</b><i>The first European country that produced bank notes was Sweden.</i><br><i>→ The first European country to produce bank notes was Sweden.</i></div></div>
    <span class="eyebrow">Noun clause kısaltmaları (soru kelimesi + to V1)</span>`+tbl(['Yapı','Örnek'],[['who','She knows who to ask.'],['whom','The committee discussed whom to appoint.'],['what','I don’t know what to say.'],['where','He showed us where to park.'],['when','They decided when to leave.'],['why','He explained why to change the plan.'],['whether','They discussed whether to invest.'],['how','He learned how to drive.']].map(r=>`<tr><td><code>${r[0]} + to V1</code></td><td>${r[1]}</td></tr>`));

function dictResults(){
  const q=norm(DQ.trim());

  if(q){const esc2=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),wb=new RegExp('(^|[^a-z0-9])'+esc2);
    const rank=x=>{const w=norm(x.w),m=norm(x.m);if(w===q)return 0;if(w.startsWith(q+' ')||w.startsWith(q+' ('))return 1;if(w.startsWith(q))return 2;if(wb.test(w))return 3;if(w.includes(q))return 4;
      const mt=m.split(/[;,/]/).map(t=>t.replace(/\(.*?\)/g,'').trim());if(mt.includes(q))return 5;if(mt.some(t=>t.startsWith(q)))return 6;if(wb.test(m))return 7;return m.includes(q)?8:9};
    r=r.map(x=>[rank(x),x]).filter(a=>a[0]<9).sort((a,b)=>a[0]-b[0]||a[1].w.length-b[1].w.length).map(a=>a[1])}

let STR_OPEN=false,strOpener=null;
function setStreak(open,opener,fromPop){const sh=document.getElementById('strsheet'),sc=document.getElementById('strscrim');
  if(open===STR_OPEN&&!open)return;if(open)sheetPushed('strsheet');else sheetPopped('strsheet',fromPop);
  if(open)renderStreak();sh.classList.toggle('open',open);sc.classList.toggle('open',open);sh.setAttribute('aria-hidden',!open);STR_OPEN=open;
  if(open){strOpener=opener||null;setTimeout(()=>{const x=sh.querySelector('.sheet-x');x&&x.focus({preventScroll:true})},60)}
  else if(strOpener){try{strOpener.focus({preventScroll:true})}catch(_){}strOpener=null}}
document.addEventListener('keydown',e=>{if(STR_OPEN&&e.key==='Escape'){setStreak(false);e.stopImmediatePropagation();e.preventDefault()}},true);
/* ask before replacing an unfinished test */
let pendingQuiz=null,QASK_OPEN=false,qaskOpener=null;
function quizInProgress(){return (Q.phase==='run'||Q.paused)&&Q.qs.length&&(Q.i>0||Q.picked!==null)}
function askNewQuiz(fn,opener){if(!quizInProgress()){fn();return}pendingQuiz=fn;
  const done=Q.res.length,tot=Q.qs.length,c=Q.res.filter(r=>r.ok).length;
  document.getElementById('qask-d').textContent=`${tot} soruluk testte ${done} soru cevapladın (${c} doğru). Yeni test başlatırsan bu test silinir.`;
  qaskOpener=opener||null;setQAsk(true)}
function setQAsk(open,fromPop){if(open===QASK_OPEN&&!open)return;if(open)sheetPushed('qasksheet');else sheetPopped('qasksheet',fromPop);const sh=document.getElementById('qasksheet'),sc=document.getElementById('qaskscrim');sh.classList.toggle('open',open);sc.classList.toggle('open',open);sh.setAttribute('aria-hidden',!open);QASK_OPEN=open;
  if(open)setTimeout(()=>{const x=sh.querySelector('[data-act=qresume]');x&&x.focus({preventScroll:true})},60);else if(qaskOpener){try{qaskOpener.focus({preventScroll:true})}catch(_){}qaskOpener=null}}
document.addEventListener('keydown',e=>{if(QASK_OPEN&&e.key==='Escape'){setQAsk(false);pendingQuiz=null;e.stopImmediatePropagation();e.preventDefault()}},true);
/* sheets own a history entry: the back button closes the open sheet instead of leaving the screen */
let sheetHist=null,afterPop=null;
function sheetPushed(id){if(sheetHist)return;try{history.pushState({sheet:id},'');sheetHist=id}catch(e){}}
function sheetPopped(id,fromPop){if(sheetHist!==id)return;sheetHist=null;if(!fromPop){try{history.back()}catch(e){}}}
function closeSheetThen(id,fn){if(sheetHist===id){afterPop=fn;closeSheet(id,false)}else{closeSheet(id,true);fn()}}
function closeSheet(id,fromPop){if(id==='setsheet')setSettings(false,null,fromPop);else if(id==='strsheet')setStreak(false,null,fromPop);else if(id==='qasksheet'){setQAsk(false,fromPop);pendingQuiz=null}}
function closeAllSheets(){if(SET_OPEN)setSettings(false,null,true);if(STR_OPEN)setStreak(false,null,true);if(QASK_OPEN){setQAsk(false,true);pendingQuiz=null}if(sheetHist){sheetHist=null}}
window.addEventListener('popstate',()=>{if(sheetHist){const id=sheetHist;sheetHist=null;closeSheet(id,true)}if(afterPop){const f=afterPop;afterPop=null;f()}});
/* shared sheet behaviour: focus trap + drag handle to close */
function enhanceSheet(id,close){const sh=document.getElementById(id);if(!sh)return;
  sh.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const f=[...sh.querySelectorAll('button,[href],input,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent&&!x.closest('[inert]'));if(!f.length)return;
    const a=f[0],z=f[f.length-1];if(e.shiftKey&&(document.activeElement===a||!sh.contains(document.activeElement))){z.focus();e.preventDefault()}else if(!e.shiftKey&&(document.activeElement===z||!sh.contains(document.activeElement))){a.focus();e.preventDefault()}});
  let y0=null,dy=0;const zones=[sh.querySelector('.sheet-grab'),sh.querySelector('.sheet-head')].filter(Boolean);
  for(const z of zones){z.style.touchAction='none';
    z.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;y0=e.clientY;dy=0;try{z.setPointerCapture(e.pointerId)}catch(_){}sh.classList.add('drag')});
    z.addEventListener('pointermove',e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translateY(${dy}px)`});
    const up=()=>{if(y0===null)return;y0=null;sh.classList.remove('drag');sh.style.transform='';if(dy>80)close()};z.addEventListener('pointerup',up);z.addEventListener('pointercancel',up)}}
enhanceSheet('setsheet',()=>setSettings(false));
enhanceSheet('strsheet',()=>setStreak(false));
enhanceSheet('qasksheet',()=>{setQAsk(false);pendingQuiz=null});

function hideLToast(){const t=document.getElementById('ltoast');if(!t)return;t.classList.remove('show');clearTimeout(ltT);setTimeout(()=>{if(!t.classList.contains('show')){t.hidden=true;t.classList.remove('msg')}},220);document.querySelectorAll('.lchip[aria-pressed="true"]').forEach(c=>c.setAttribute('aria-pressed','false'))}

<script>
/* PWA: offline cache; a new version activates on the next launch */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  /* only a page that was already controlled is getting an update; the first install must stay silent */
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded || !hadController) return; reloaded = true;
    try { typeof toastMsg === 'function' && toastMsg('Uygulama güncellendi.'); } catch (e) {}
  });
}
